version: "3.9"

services:

  # ── Backend Agent API ────────────────────────────────────────────────────────
  agent-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_ITERATIONS=5
      - GIT_USER_NAME=CI/CD AI Agent
      - GIT_USER_EMAIL=ai-agent@cicd.bot
      - RESULTS_DIR=/tmp/cicd_results
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - results_vol:/tmp/cicd_results
    # ── Sandbox security ──
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/cicd_agent:size=512m
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      agent-api:
        condition: service_healthy

volumes:
  results_vol:
